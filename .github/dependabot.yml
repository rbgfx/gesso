version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Sibling repos are unavailable to the isolated updater.
    ignore:
      - dependency-name: glyphic
      - dependency-name: larb
      - dependency-name: rbgl
      - dependency-name: tessel
      - dependency-name: twiddle
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
